<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>El Saque de Reconciliación · Video 10s con Personajes 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <!-- Three.js UMD -->
  <script src="assets/three.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #04060a;
      color: #e2e8f0;
      font-family: 'Inter', -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #viewport-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage-container {
      position: relative;
      width: 1920px;
      height: 1080px;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      background: #060911;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.85);
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #webgl-canvas {
      z-index: 1;
    }
    #overlay-canvas {
      z-index: 2;
      pointer-events: none;
    }

    /* Player Toolbar */
    #player-toolbar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(10, 14, 24, 0.9);
      border: 1px solid rgba(63, 216, 255, 0.25);
      border-radius: 30px;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }
    #play-btn {
      background: #ffd400;
      border: none;
      color: #060911;
      padding: 8px 18px;
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    #play-btn:hover {
      background: #ffea70;
      transform: scale(1.05);
    }
    #time-slider {
      width: 320px;
      accent-color: #ffd400;
      cursor: pointer;
    }
    #time-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      color: #3fd8ff;
      min-width: 65px;
    }
  </style>
</head>
<body>
  <div id="viewport-wrapper">
    <div id="stage-container">
      <canvas id="webgl-canvas" width="1920" height="1080"></canvas>
      <canvas id="overlay-canvas" width="1920" height="1080"></canvas>
    </div>

    <!-- Scrubber Toolbar -->
    <div id="player-toolbar">
      <button id="play-btn">REPRODUCIR</button>
      <input type="range" id="time-slider" min="0" max="10.0" step="0.04" value="0">
      <span id="time-label">0.00 s</span>
    </div>
  </div>

  <script type="module" src="./main.js?v=4"></script>
</body>
</html>
